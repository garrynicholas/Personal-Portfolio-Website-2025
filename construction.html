<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Gunawan Widya Nugraha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #050508;
            --line: rgba(255, 255, 255, .1);
            --text: #f5f6fa;
            --muted: #b7bac6;
            --magenta: #ff2ed2;
            --purple: #8a2bff;
            --blue: #2ba6ff;
            --orange: #ff8c3a
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden
        }

        /* glow + halftone dots (biru kanan-atas, oranye kiri-bawah) */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(640px 420px at 78% 20%, rgba(43, 166, 255, .28), transparent 62%),
                radial-gradient(560px 420px at 22% 80%, rgba(255, 46, 210, .22), transparent 62%),
                radial-gradient(420px 320px at 50% 50%, rgba(138, 43, 255, .14), transparent 62%);
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            width: 46%;
            height: 60%;
            pointer-events: none;
            background-image: radial-gradient(rgba(130, 195, 255, .5) 1.2px, transparent 1.3px);
            background-size: 10px 10px;
            -webkit-mask-image: radial-gradient(ellipse at top right, #000 18%, transparent 72%);
            mask-image: radial-gradient(ellipse at top right, #000 18%, transparent 72%);
        }

        .dots-orange {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 42%;
            height: 55%;
            pointer-events: none;
            background-image: radial-gradient(rgba(255, 170, 90, .5) 1.2px, transparent 1.3px);
            background-size: 9px 9px;
            -webkit-mask-image: radial-gradient(ellipse at bottom left, #000 15%, transparent 70%);
            mask-image: radial-gradient(ellipse at bottom left, #000 15%, transparent 70%);
        }

        .board {
            width: 100%;
            max-width: 760px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(10, 10, 16, .82);
            backdrop-filter: blur(8px);
            padding: 56px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, .7), 0 0 60px rgba(138, 43, 255, .12)
        }

        .board::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -40%;
            width: 70%;
            height: 80%;
            transform: translateX(-50%);
            background: radial-gradient(closest-side, rgba(255, 46, 210, .18), transparent 70%);
            pointer-events: none
        }

        /* gear + wrench animasi */
        .gear-wrap {
            width: 86px;
            height: 86px;
            margin: 0 auto 26px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 46, 210, .25), rgba(43, 166, 255, .25));
            border: 1px solid rgba(255, 255, 255, .14)
        }

        .gear-wrap>i {
            animation: spin 6s linear infinite
        }

        .gear-wrap .bolt {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(10, 10, 16, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--orange);
            border: 1px solid rgba(255, 140, 58, .4);
            bottom: -10px;
            right: -10px
        }

        .gear-wrap .bolt i {
            animation: wobble 2.2s ease-in-out infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes wobble {

            0%,
            100% {
                transform: rotate(-12deg)
            }

            50% {
                transform: rotate(14deg)
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }

            50% {
                transform: scale(1.35);
                opacity: .6
            }
        }

        h1 {
            font-size: clamp(38px, 6vw, 64px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.05;
            margin-bottom: 12px
        }

        .grad-text {
            background: linear-gradient(90deg, var(--magenta), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sub-badge {
            display: inline-block;
            margin: 0 0 18px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #9fe8b9;
            border: 1px solid rgba(120, 255, 170, .25);
            background: rgba(80, 255, 140, .08)
        }

        .desc {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.65;
            max-width: 460px;
            margin: 0 auto 30px
        }

        /* progress bar berjalan */
        .progress {
            max-width: 420px;
            margin: 0 auto 34px
        }

        .progress .bar {
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .08);
            overflow: hidden;
            position: relative
        }

        .progress .bar i {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 38%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--magenta), var(--purple), var(--blue));
            box-shadow: 0 0 16px rgba(255, 46, 210, .5);
            animation: load 2.4s ease-in-out infinite
        }

        @keyframes load {
            0% {
                left: -40%
            }

            100% {
                left: 105%
            }
        }

        .progress small {
            display: flex;
            justify-content: space-between;
            color: #8f93a3;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 10px
        }

        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            transition: .25s;
            text-decoration: none
        }

        .btn-primary {
            background: linear-gradient(90deg, #b32ce0, #7a3bff);
            color: #fff;
            box-shadow: 0 4px 14px rgba(122, 43, 255, .22)
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(122, 43, 255, .35)
        }

        .btn-ghost {
            border: 1px solid rgba(255, 255, 255, .25);
            color: #e8eaf2
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, .08)
        }

        .foot {
            margin-top: 36px;
            color: #84879a;
            font-size: 12px;
            letter-spacing: .8px
        }
    </style>
</head>

<body>
    <div class="dots-orange"></div>

    <main class="board">
        <div class="gear-wrap">
            <i class="fa-solid fa-gear"></i>
            <span class="bolt"><i class="fa-solid fa-screwdriver-wrench"></i></span>
        </div>
        <h1>Page <span class="grad-text">Not Found</span></h1>
        <span class="sub-badge">404</span>
        <p class="desc">Looks like the owner didn't update the sites. We'll fix this sooner!</p>

        <div class="progress">
            <div class="bar"><i></i></div>
            <small><span>Fixing issues</span><span id="pct">62%</span></small>
        </div>

        <div class="actions">
            <a class="btn btn-primary" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
            <a class="btn btn-ghost" href="index.html#contact"><i class="fa-solid fa-envelope"></i> Contact Me</a>
        </div>

        <p class="foot">© <span id="yearNow"></span> Gunawan Widya Nugraha</p>
    </main>

    <script>
        document.getElementById('yearNow').textContent = new Date().getFullYear();
        // persentase "progres" yang hidup (62% → 97%, lalu ulang)
        const pct = document.getElementById('pct');
        let v = 62;
        setInterval(() => { v = v >= 97 ? 62 : v + 1; pct.textContent = v + '%'; }, 350);
    </script>
</body>

</html>
