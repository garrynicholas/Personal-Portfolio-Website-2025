<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #050508;
            --line: rgba(255, 255, 255, .1);
            --text: #f5f6fa;
            --muted: #b7bac6;
            --magenta: #ff2ed2;
            --purple: #8a2bff;
            --blue: #2ba6ff;
            --orange: #ff8c3a
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(640px 420px at 78% 20%, rgba(43, 166, 255, .26), transparent 62%),
                radial-gradient(560px 420px at 22% 80%, rgba(255, 46, 210, .2), transparent 62%),
                radial-gradient(420px 320px at 50% 50%, rgba(138, 43, 255, .14), transparent 62%);
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            right: 0;
            width: 46%;
            height: 60%;
            pointer-events: none;
            background-image: radial-gradient(rgba(130, 195, 255, .5) 1.2px, transparent 1.3px);
            background-size: 10px 10px;
            -webkit-mask-image: radial-gradient(ellipse at top right, #000 18%, transparent 72%);
            mask-image: radial-gradient(ellipse at top right, #000 18%, transparent 72%);
        }

        .dots-orange {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 42%;
            height: 55%;
            pointer-events: none;
            background-image: radial-gradient(rgba(255, 170, 90, .5) 1.2px, transparent 1.3px);
            background-size: 9px 9px;
            -webkit-mask-image: radial-gradient(ellipse at bottom left, #000 15%, transparent 70%);
            mask-image: radial-gradient(ellipse at bottom left, #000 15%, transparent 70%);
        }

        .board {
            width: 100%;
            max-width: 470px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: rgba(10, 10, 16, .85);
            backdrop-filter: blur(8px);
            padding: 44px 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 90px rgba(0, 0, 0, .7), 0 0 60px rgba(138, 43, 255, .12)
        }

        .board::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -45%;
            width: 80%;
            height: 80%;
            transform: translateX(-50%);
            background: radial-gradient(closest-side, rgba(43, 166, 255, .16), transparent 70%);
            pointer-events: none
        }

        /* 💼💰 jadi ikon briefcase + badge sack-dollar */
        .icon-wrap {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            color: #fff;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 46, 210, .25), rgba(43, 166, 255, .25));
            border: 1px solid rgba(255, 255, 255, .14)
        }

        .icon-wrap .coin {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: rgba(10, 10, 16, .92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--orange);
            border: 1px solid rgba(255, 140, 58, .4);
            bottom: -9px;
            right: -9px
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #bfe3ff;
            border: 1px solid rgba(43, 166, 255, .4);
            background: rgba(43, 166, 255, .1);
            margin-bottom: 16px
        }

        .badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--blue);
            box-shadow: 0 0 10px var(--blue);
            animation: pulse 1.6s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1
            }

            50% {
                transform: scale(1.35);
                opacity: .6
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px
        }

        .grad-text {
            background: linear-gradient(90deg, var(--magenta), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sub {
            color: var(--muted);
            font-size: 13px;
            letter-spacing: .4px;
            margin: 8px 0 26px
        }

        form {
            text-align: left
        }

        .field {
            margin-bottom: 16px
        }

        .field label {
            display: block;
            font-size: 11px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #8f93a3;
            margin-bottom: 8px
        }

        .input-wrap {
            position: relative
        }

        .input-wrap>i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8f93a3;
            font-size: 13px;
            pointer-events: none
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 44px 14px 42px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: .25s
        }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--magenta);
            box-shadow: 0 0 0 3px rgba(255, 46, 210, .15), 0 0 16px rgba(255, 46, 210, .2)
        }

        .eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8f93a3;
            cursor: pointer;
            font-size: 14px;
            padding: 6px
        }

        .eye:hover {
            color: #fff
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 26px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            transition: .25s;
            text-decoration: none;
            border: none;
            cursor: pointer
        }

        .btn-primary {
            background: linear-gradient(90deg, #b32ce0, #7a3bff);
            color: #fff;
            box-shadow: 0 4px 14px rgba(122, 43, 255, .22)
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(122, 43, 255, .35)
        }

        .btn:disabled {
            opacity: .7;
            cursor: wait
        }

        .btn-login {
            width: 100%;
            margin-top: 6px
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 11px;
            color: #8f93a3;
            letter-spacing: .5px;
            margin: 20px 0 4px
        }

        .mono b {
            color: var(--blue)
        }

        .foot-links {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 10px
        }

        .foot-links a {
            color: #aeb2c0;
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: .25s
        }

        .foot-links a:hover {
            color: #fff
        }

        .foot {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: #84879a;
            font-size: 11.5px;
            letter-spacing: .8px
        }

        /* Error message */
        .error-msg {
            display: none;
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #ffb4c4;
            background: rgba(255, 59, 92, .08);
            border: 1px solid rgba(255, 59, 92, .3);
            text-align: left;
            align-items: center;
            gap: 10px
        }

        .error-msg.show {
            display: flex;
            animation: shake .4s
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        .success-msg {
            color: #9fe8b9;
            background: rgba(80, 255, 140, .08);
            border-color: rgba(120, 255, 170, .3)
        }
    </style>
</head>

<body>
    <div class="dots-orange"></div>

    <main class="board">
        <div class="icon-wrap">
            <i class="fa-solid fa-briefcase"></i>
            <span class="coin"><i class="fa-solid fa-sack-dollar"></i></span>
        </div>

        <span class="badge"><span class="dot"></span> Admin Access</span>
        <h1>Portfolio <span class="grad-text">Manager</span></h1>
        <p class="sub">Diverse Tool Management Systems</p>

        <form id="loginForm" autocomplete="off">
            <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" type="email" placeholder="admin@domain.com" required>
                </div>
            </div>

            <div class="field">
                <label for="pass">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input id="pass" type="password" placeholder="••••••••" required>
                    <button type="button" class="eye" id="eye" title="Show / hide password"><i
                            class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <button class="btn btn-primary btn-login" id="loginBtn" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>
        </form>

        <div class="error-msg" id="errorMsg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <p class="mono">&gt; secure channel: <b>encrypted</b> — unauthorized access will be redirected</p>

        <div class="foot-links">
            <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
            <a href="failed.html"><i class="fa-solid fa-shield-halved"></i> Access Info</a>
        </div>

        <p class="foot">© <span id="yearNow"></span> Gunawan Widya Nugraha — Portfolio Manager</p>
    </main>

    <script>
        // ============ DATABASE KREDENSIAL (TER-HASH SHA-256) ============
        // Ganti hash ini kalau mau ubah email/password (lihat cara generate di bawah)
        const CREDENTIALS = {
            accounts: [
                {
                    emailHash: "9798431e5ddf6c04f33b1663a4817d95c91feab6ff5eb2c563a2dcc6ea96f0a1",
                    passwordHash: "dc0ef7910af8e3fdb8de17260335edc47836cd5038da189be71452ccdbbf47cd",
                    role: "Administrator"
                }
                // Tambah akun baru di sini kalau perlu
            ]
        };

        // Fungsi hash SHA-256 (native browser, async)
        async function sha256(text) {
            const buf = new TextEncoder().encode(text);
            const hashBuf = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hashBuf))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ============ SHOW / HIDE PASSWORD ============
        const eye = document.getElementById('eye'), pass = document.getElementById('pass');
        eye.addEventListener('click', () => {
            const show = pass.type === 'password';
            pass.type = show ? 'text' : 'password';
            eye.querySelector('i').className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // ============ LOGIN HANDLER ============
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show', 'success-msg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';

            // Hitung hash dari input
            const emailHash = await sha256(emailInput.value.trim().toLowerCase());
            const passwordHash = await sha256(pass.value);

            // Cari akun yang cocok (email + password sama-sama cocok)
            const matched = CREDENTIALS.accounts.find(acc =>
                acc.emailHash === emailHash && acc.passwordHash === passwordHash
            );

            // Delay kecil biar terasa "verifying"
            await new Promise(r => setTimeout(r, 900));

            if (matched) {
                // ✅ BERHASIL → ke tools.html
                errorText.textContent = `Welcome, ${matched.role}! Redirecting...`;
                errorMsg.classList.add('show', 'success-msg');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Authenticated';
                setTimeout(() => { window.location.href = 'tools.html'; }, 1200);
            } else {
                // ❌ GAGAL → error inline
                errorText.textContent = 'Invalid credentials. Please try again.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
                pass.value = '';
                pass.focus();
            }
        });

        document.getElementById('yearNow').textContent = new Date().getFullYear();
    </script>
</body>

</html>
